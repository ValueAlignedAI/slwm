[project]
name = "slwm-124m-research"
version = "0.0.0"
description = "Research utilities, baselines, and training runners for SLWM-124M."
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
t1-full = ["torch>=2.3", "transformers>=4.40", "datasets>=2.19", "psutil>=5.9"]
t2-full = ["torch>=2.3", "torchvision>=0.18", "torchaudio>=2.3", "matplotlib>=3.8"]
motion-research = ["torch>=2.3", "torchaudio>=2.3", "matplotlib>=3.8", "Pillow>=10", "transformers>=4.40", "pytest>=8"]

research-data = ["pyarrow==21.0.0", "publicsuffix2==2.20191221", "tiktoken>=0.9"]
research-throughput = ["liger-kernel==0.8.5"]
research-stream = ["vocos==0.1.0", "encodec==0.1.1", "cmudict==1.1.3", "soundfile==0.14.0", "opencv-python-headless>=4.11", "scipy>=1.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
